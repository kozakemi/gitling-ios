name: Build IPA

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select toolchain
        run: |
          echo "DEVELOPER_DIR=$(xcode-select -p)" >> "$GITHUB_ENV"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Check localizations
        run: ./scripts/check-localizations.py

      - name: Run tests
        run: ./scripts/test.sh

      - name: Collect test diagnostics
        if: always()
        run: |
          mkdir -p build/ci-diagnostics
          python3 - <<'PY'
          import json
          from pathlib import Path
          import shutil
          destination = Path('build/ci-diagnostics')
          for source in Path.home().joinpath('Library/Logs/DiagnosticReports').glob('Gitling*.ips'):
              shutil.copy2(source, destination / source.name)
              try:
                  report = json.loads(source.read_text().split('\n', 1)[1])
                  print(source.name, report.get('exception'), report.get('termination'))
                  for thread in report.get('threads', []):
                      if thread.get('triggered'):
                          print(json.dumps(thread, indent=2))
              except (ValueError, IndexError) as error:
                  print('Cannot summarize crash report:', error)
          PY

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Gitling-test-diagnostics
          path: |
            build/TestDerivedData-*/Logs/Test/
            build/ci-diagnostics/
          if-no-files-found: warn
          retention-days: 7

      - name: Build IPA
        run: ./scripts/build-ipa.sh

      - name: Inspect IPA
        run: |
          ls -lh build/Gitling.ipa
          unzip -l build/Gitling.ipa | sed -n '1,20p'

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Gitling-unsigned-ipa
          path: build/Gitling.ipa
          if-no-files-found: error
          retention-days: 30
